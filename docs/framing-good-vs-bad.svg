<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="framing-title framing-desc">
  <title id="framing-title">Good vs. bad framing and distance</title>
  <desc id="framing-desc">Three camera-frame examples: a well-centered face and chest at a comfortable distance; a face too close, cropped at the top of the frame; and a face too far away, a small fraction of the frame.</desc>

  <defs>
    <clipPath id="clipGoodFrame"><rect x="20" y="74" width="200" height="160" rx="8"/></clipPath>
    <clipPath id="clipCloseFrame"><rect x="20" y="74" width="200" height="160" rx="8"/></clipPath>
    <clipPath id="clipFarFrame"><rect x="20" y="74" width="200" height="160" rx="8"/></clipPath>
  </defs>

  <!-- Good: centered, good distance -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="240" height="260" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="9" fill="#0ca30c"/>
    <path d="M20,28 L23,31 L29,23" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="32" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="600" fill="#0b0b0b">Good distance</text>
    <text x="20" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#52514e">Centered, chest + abdomen visible</text>

    <rect x="20" y="74" width="200" height="160" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4,4"/>
    <g clip-path="url(#clipGoodFrame)">
      <path d="M70,234 C70,190 74,164 96,150 Q120,140 144,150 C166,164 170,190 170,234 Z" fill="#d9cdbb"/>
      <circle cx="120" cy="118" r="34" fill="#d9cdbb"/>
      <ellipse cx="110" cy="105" rx="16" ry="10" fill="#ffffff" opacity="0.3"/>
      <circle cx="109" cy="115" r="4" fill="#3a352c"/>
      <circle cx="131" cy="115" r="4" fill="#3a352c"/>
      <path d="M105,130 Q120,139 135,130" fill="none" stroke="#3a352c" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="20" y="252" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#52514e">Chest and a bit of abdomen visible</text>
  </g>

  <!-- Too close -->
  <g transform="translate(280,20)">
    <rect x="0" y="0" width="240" height="260" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="9" fill="#d03b3b"/>
    <path d="M21,25 L27,31 M27,25 L21,31" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="32" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="600" fill="#0b0b0b">Too close</text>
    <text x="20" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#52514e">Face fills and clips the frame</text>

    <rect x="20" y="74" width="200" height="160" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4,4"/>
    <g clip-path="url(#clipCloseFrame)">
      <path d="M-40,300 Q-40,190 20,172 L220,172 Q280,190 280,300 Z" fill="#d9cdbb"/>
      <circle cx="120" cy="88" r="95" fill="#d9cdbb"/>
      <circle cx="92" cy="76" r="9" fill="#3a352c"/>
      <circle cx="148" cy="76" r="9" fill="#3a352c"/>
      <path d="M84,118 Q120,140 156,118" fill="none" stroke="#3a352c" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="20" y="252" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#52514e">Forehead and chest are cut off</text>
  </g>

  <!-- Too far -->
  <g transform="translate(540,20)">
    <rect x="0" y="0" width="240" height="260" rx="14" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="9" fill="#d03b3b"/>
    <path d="M21,25 L27,31 M27,25 L21,31" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="32" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" font-weight="600" fill="#0b0b0b">Too far</text>
    <text x="20" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#52514e">Face is a small fraction of frame</text>

    <rect x="20" y="74" width="200" height="160" rx="8" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="1.5" stroke-dasharray="4,4"/>
    <g clip-path="url(#clipFarFrame)">
      <path d="M104,192 Q104,180 112,176 L128,176 Q136,180 136,192 Z" fill="#d9cdbb"/>
      <circle cx="120" cy="160" r="16" fill="#d9cdbb"/>
      <circle cx="115" cy="158" r="1.8" fill="#3a352c"/>
      <circle cx="125" cy="158" r="1.8" fill="#3a352c"/>
    </g>
    <text x="20" y="252" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" fill="#52514e">Signal is too weak to track well</text>
  </g>
</svg>
